<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decrypt Image</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Decrypt Your Image 🔓</h1>
    <form action="{{ url_for('decrypt_pdf') }}" method="post" enctype="multipart/form-data" class="form-box">
      <input type="file" name="file" accept="application/pdf" required><br>
      <input type="password" name="password" placeholder="Enter Decryption Password" required><br>
      <button type="submit" class="btn">Decrypt & Download</button>
    </form>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<p class="error">{{ messages[0] }}</p>{% endif %}
    {% endwith %}
    <div class="navigation">
      <p>Want to encrypt another file? <a href="{{ url_for('encrypt_pdf') }}" class="nav-link">Go to Encrypt</a></p>
    </div>
  </div>
</body>
</html>
